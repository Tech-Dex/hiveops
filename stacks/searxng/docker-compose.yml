services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL}
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_VALKEY_URL=valkey://searxng-valkey:6379/0
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/searxng:/etc/searxng:rw
      - searxng-cache:/var/cache/searxng:rw
    networks:
      - proxy
      - searxng
    depends_on:
      - searxng-valkey
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

  searxng-valkey:
    image: docker.io/valkey/valkey:8-alpine
    container_name: searxng-valkey
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - ${CONFIG_PATH}/searxng-valkey:/data:rw
    networks:
      - searxng
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  proxy:
    external: true
    name: proxy

  searxng:
    name: searxng
    driver: bridge
    internal: true

volumes:
  searxng-cache:
